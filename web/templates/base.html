<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hitpoint Sales Intelligence{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; font-size: .92rem; }
    .navbar-brand { font-weight: 800; letter-spacing: -.5px; font-size: 1.1rem; }
    .navbar-brand span { color: #ffc107; }

    /* Tier badges */
    .tier-A { background:#198754!important; color:#fff; }
    .tier-B { background:#e6a817!important; color:#000; }
    .tier-C { background:#6c757d!important; color:#fff; }

    /* Concur badges */
    .concur-Yes     { background:#0d6efd!important; color:#fff; }
    .concur-No      { background:#dc3545!important; color:#fff; }
    .concur-Unknown { background:#fd7e14!important; color:#fff; }

    /* Score numbers */
    .score-xl { font-size: 3rem; font-weight: 900; line-height: 1; }
    .score-lg { font-size: 1.6rem; font-weight: 700; }
    .score-good  { color: #198754; }
    .score-ok    { color: #e6a817; }
    .score-low   { color: #dc3545; }

    /* Cards */
    .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .section-header { font-weight: 700; color: #343a40; border-left: 4px solid #0d6efd;
                      padding-left: .6rem; margin: 1.5rem 0 .75rem; }
    .ai-box { background: #e8f4fd; border-left: 4px solid #0d6efd;
              border-radius: .5rem; padding: 1rem 1.2rem; line-height: 1.7; }
    .table-sm td, .table-sm th { padding: .35rem .5rem; }
    .trigger-flag { color: #dc3545; font-size: .85rem; }
    a.row-link { color: inherit; text-decoration: none; }
    a.row-link:hover { color: #0d6efd; }
    .md-render strong { font-weight: 700; }
    .md-render code { background: #f1f3f5; padding: .1rem .3rem; border-radius: .25rem;
                      font-size: .85em; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3 py-2">
  <a class="navbar-brand" href="/"><span>⚡</span> Hitpoint Sales Intel</a>
  <div class="d-flex gap-2 align-items-center">
    <a href="/export" class="btn btn-sm btn-outline-success">
      <i class="bi bi-file-excel"></i> Export Excel
    </a>
    <span class="text-muted small">Account Copilot</span>
  </div>
</nav>

<div class="container-fluid py-3 px-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
    <div class="alert alert-{{ cat }} alert-dismissible fade show py-2" role="alert">
      {{ msg }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Lightweight Markdown inline renderer (bold + code only)
document.querySelectorAll('.md-render').forEach(el => {
  el.innerHTML = el.innerHTML
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
